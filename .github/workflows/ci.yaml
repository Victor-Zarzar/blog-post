name: Main CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  SKIP_ENV_VALIDATION: "true"
  NEXT_PUBLIC_DISABLE_DEVTOOLS: "true"
  NEXT_PUBLIC_WEBSITE_URL: "http://localhost:3000"
  DATABASE_URL: "postgresql://user:pass@localhost:5432/test_db"
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  BETTER_AUTH_URL: "http://localhost:3000"
  GITHUB_CLIENT_ID: something
  GITHUB_CLIENT_SECRET: something
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  SENTRY_RELEASE: ${{ secrets.SENTRY_RELEASE }}
  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
  GOOGLE_RECAPTCHA_SECRET_KEY: ${{ secrets.GOOGLE_RECAPTCHA_SECRET_KEY }}
  NEXT_PUBLIC_GOOGLE_RECAPTCHA_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_RECAPTCHA_PUBLIC_KEY }}
  REDIS_URL: "redis://localhost:6379"

jobs:
  build:
    name: Bun CI
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project

      - name: Typegen
        run: bun run typegen

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build
